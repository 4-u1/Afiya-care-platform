<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer 'A' Ribbon Blue Gradient -->
    <linearGradient id="aafiyaBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="40%" stop-color="#1D4ED8" />
      <stop offset="85%" stop-color="#0F3B82" />
      <stop offset="100%" stop-color="#0A2758" />
    </linearGradient>

    <!-- 'A' Inner Shadow / Shading Fold -->
    <linearGradient id="aafiyaFoldGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0A2550" />
    </linearGradient>

    <!-- Emerald Swoosh Gradient -->
    <linearGradient id="aafiyaSwooshGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Heart Emerald Gradient -->
    <linearGradient id="aafiyaHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Soft Depth Filter -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F2F64" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Group: Main Healthcare Icon Emblem -->
  <g filter="url(#softGlow)">
    <!-- Back part of the Swoosh orbit (curves behind the right leg) -->
    <path 
      d="M 330 185 C 380 160, 420 145, 440 145 C 445 145, 435 160, 400 190 C 375 210, 350 225, 325 235 Z" 
      fill="url(#aafiyaSwooshGrad)" 
      opacity="0.95"
    />

    <!-- Main Folded Letter 'A' Outer Frame -->
    <!-- Left Leg and Apex Arch -->
    <path 
      d="M 135 340 
         C 145 295, 175 200, 220 120 
         C 238 88, 256 72, 275 80 
         C 295 88, 305 110, 315 140 
         L 282 152 
         C 272 125, 260 110, 252 110 
         C 225 110, 195 200, 172 315 
         C 160 328, 142 336, 135 340 Z" 
      fill="url(#aafiyaBlueGrad)" 
    />

    <!-- Right Leg of the Letter 'A' (Descending from Apex with bold volume) -->
    <path 
      d="M 275 80 
         C 305 95, 345 160, 385 245 
         C 405 285, 415 315, 422 335 
         C 410 338, 385 330, 368 310 
         C 348 268, 318 190, 290 140 
         Z" 
      fill="url(#aafiyaBlueGrad)" 
    />

    <!-- Bottom connecting curves of the A -->
    <path 
      d="M 135 340 
         C 145 352, 170 348, 185 335 
         C 192 328, 205 320, 225 330 
         C 205 345, 175 355, 135 340 Z" 
      fill="#0A2550" 
      opacity="0.8" 
    />

    <!-- Right Leg Base Contour -->
    <path 
      d="M 422 335 
         C 408 350, 375 352, 350 330 
         C 362 320, 380 322, 422 335 Z" 
      fill="#0A2550" 
      opacity="0.75" 
    />

    <!-- Front Crossing Emerald Swoosh Orbit -->
    <!-- Sweeps from bottom left across the front of A towards the right -->
    <path 
      d="M 108 268 
         C 145 240, 210 220, 280 205 
         C 350 190, 410 165, 440 145 
         C 420 162, 360 192, 290 215 
         C 220 238, 150 260, 110 285 
         C 104 280, 105 272, 108 268 Z" 
      fill="url(#aafiyaSwooshGrad)" 
    />

    <!-- Central Heart Emblem -->
    <g transform="translate(256, 275) scale(1.15)">
      <!-- Heart Path centered at (0,0) -->
      <path 
        d="M 0 35 
           C -4 -2, -45 -18, -45 -48 
           C -45 -66, -30 -78, -12 -78 
           C 0 -78, 0 -65, 0 -60 
           C 0 -65, 0 -78, 12 -78 
           C 30 -78, 45 -66, 45 -48 
           C 45 -18, 4 -2, 0 35 Z" 
        fill="url(#aafiyaHeartGrad)" 
      />

      <!-- Crisp White ECG Cardiac Pulse Rhythm Line -->
      <path 
        d="M -32 -48 
           L -15 -48 
           L -10 -58 
           L -4 -32 
           L 4 -68 
           L 10 -40 
           L 16 -50 
           L 32 -50" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
      />
    </g>
  </g>

  <!-- Typography: Arabic 'عافية كير' and English 'AafiyaCare' -->
  <g text-anchor="middle" id="logo-text">
    <!-- Arabic Calligraphy Line: عافية كير -->
    <text 
      x="256" 
      y="425" 
      font-family="'Tajawal', 'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', system-ui, sans-serif" 
      font-size="44" 
      font-weight="900" 
      fill="#0C3B7C"
      direction="rtl"
      unicode-bidi="embed"
    >عافية كير</text>

    <!-- English Brand Line: AafiyaCare -->
    <text 
      x="256" 
      y="472" 
      font-family="'Inter', 'Plus Jakarta Sans', system-ui, sans-serif" 
      font-size="34" 
      font-weight="800" 
      letter-spacing="0.5px"
    >
      <tspan fill="#0C3B7C">Aafiya</tspan><tspan fill="#059669">Care</tspan>
    </text>
  </g>
</svg>
