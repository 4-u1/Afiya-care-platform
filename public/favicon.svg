<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="favBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="40%" stop-color="#1D4ED8" />
      <stop offset="90%" stop-color="#0F3B82" />
    </linearGradient>

    <linearGradient id="favSwooshGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="favHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2F64" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background container for high-contrast crisp tab display -->
  <rect width="512" height="512" rx="100" fill="#FFFFFF" />

  <!-- Centered Icon Emblem -->
  <g transform="translate(0, 30)" filter="url(#favGlow)">
    <!-- Back orbit -->
    <path 
      d="M 330 185 C 380 160, 420 145, 440 145 C 445 145, 435 160, 400 190 C 375 210, 350 225, 325 235 Z" 
      fill="url(#favSwooshGrad)" 
      opacity="0.95"
    />

    <!-- Left Leg and Apex -->
    <path 
      d="M 135 340 
         C 145 295, 175 200, 220 120 
         C 238 88, 256 72, 275 80 
         C 295 88, 305 110, 315 140 
         L 282 152 
         C 272 125, 260 110, 252 110 
         C 225 110, 195 200, 172 315 
         C 160 328, 142 336, 135 340 Z" 
      fill="url(#favBlueGrad)" 
    />

    <!-- Right Leg -->
    <path 
      d="M 275 80 
         C 305 95, 345 160, 385 245 
         C 405 285, 415 315, 422 335 
         C 410 338, 385 330, 368 310 
         C 348 268, 318 190, 290 140 
         Z" 
      fill="url(#favBlueGrad)" 
    />

    <!-- Bottom curves -->
    <path 
      d="M 135 340 C 145 352, 170 348, 185 335 C 192 328, 205 320, 225 330 C 205 345, 175 355, 135 340 Z" 
      fill="#0A2550" 
      opacity="0.8" 
    />
    <path 
      d="M 422 335 C 408 350, 375 352, 350 330 C 362 320, 380 322, 422 335 Z" 
      fill="#0A2550" 
      opacity="0.75" 
    />

    <!-- Front Emerald Swoosh Orbit -->
    <path 
      d="M 108 268 
         C 145 240, 210 220, 280 205 
         C 350 190, 410 165, 440 145 
         C 420 162, 360 192, 290 215 
         C 220 238, 150 260, 110 285 
         C 104 280, 105 272, 108 268 Z" 
      fill="url(#favSwooshGrad)" 
    />

    <!-- Central Heart -->
    <g transform="translate(256, 275) scale(1.22)">
      <path 
        d="M 0 35 
           C -4 -2, -45 -18, -45 -48 
           C -45 -66, -30 -78, -12 -78 
           C 0 -78, 0 -65, 0 -60 
           C 0 -65, 0 -78, 12 -78 
           C 30 -78, 45 -66, 45 -48 
           C 45 -18, 4 -2, 0 35 Z" 
        fill="url(#favHeartGrad)" 
      />

      <!-- ECG Line -->
      <path 
        d="M -32 -48 L -15 -48 L -10 -58 L -4 -32 L 4 -68 L 10 -40 L 16 -50 L 32 -50" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
      />
    </g>
  </g>
</svg>
